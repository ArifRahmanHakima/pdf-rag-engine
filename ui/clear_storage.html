<!DOCTYPE html>
<html>
<head>
    <title>Clear LocalStorage</title>
</head>
<body>
    <h1>Clearing LocalStorage...</h1>
    <script>
        localStorage.clear();
        console.log("[✓] LocalStorage cleared!");
        document.body.innerHTML = '<h1>✓ LocalStorage cleared!</h1><p>You can close this tab.</p>';
    </script>
</body>
</html>
