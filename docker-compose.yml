version: '3.9'

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-app
    
    # DNS Configuration - use Google DNS to resolve Supabase
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    
    # Volume mounts (share files between host and container)
    volumes:
      # Application code
      - .:/app
      
      # Persistent data directories
      - ./rag_storage:/app/rag_storage
      - ./output:/app/output
      - ./logs:/app/logs
      
      # Python cache (optional)
      - /app/__pycache__
      - /app/.pytest_cache
    
    # Working directory
    working_dir: /app
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Network
    networks:
      - rag-network
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

networks:
  rag-network:
    driver: bridge
